[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docclassify-backend"
version = "1.0.0"
description = "Document Classification & Extraction System — backend API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.14",
  "uvicorn[standard]==0.34.3",
  "python-multipart==0.0.20",
  "pydantic==2.12.5",
  "pydantic-settings==2.10.1",
  "httpx==0.28.1",
  "typesafe-sdk==0.7.2",
  "anthropic==0.69.0",
  "pytesseract==0.3.13",
  "pdfplumber==0.11.7",
  "pdf2image==1.17.0",
  "pypdf==5.9.0",
  "Pillow==11.3.0",
  "python-ulid==3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "respx==0.22.0",
  "ruff==0.13.3",
  "mypy==1.18.2",
  "reportlab==4.4.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "tesseract: requires the Tesseract binary (skipped when not installed)",
  "poppler: requires Poppler for pdf2image (skipped when not installed)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pytesseract", "pytesseract.*", "pdf2image", "pdf2image.*", "pdfplumber", "pdfplumber.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true
